name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip nbformat pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Repository checks (data files, sizes, course notices, secrets, notebook schema)
        run: python scripts/check_repo.py
